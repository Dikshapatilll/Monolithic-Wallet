server.port=${PORT:8080}
spring.application.name=wallet

# Database Configuration (Environment variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:WalletMonolithAppSecureSecretKeyForJWTAuth2026!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Daily Transfer Limit (Can be configured per environment)
wallet.transfer.daily-limit=${DAILY_TRANSFER_LIMIT:10000.00}

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
