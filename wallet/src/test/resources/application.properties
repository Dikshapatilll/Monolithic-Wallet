spring.application.name=wallet-test

# Use H2 in-memory database with MySQL syntax for fast, isolated tests
spring.datasource.url=jdbc:h2:mem:wallet_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
jwt.secret=TestSecretKeyForAutomatedTestingThatIsAtLeast32BytesLong!
jwt.expiration=86400000

# Daily Transfer Limit for testing
wallet.transfer.daily-limit=10000.00
